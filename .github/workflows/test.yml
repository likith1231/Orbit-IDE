name: Test

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: ai_cloud_ide_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/ai_cloud_ide_test"
      TEST_DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/ai_cloud_ide_test"
      JWT_SECRET: "test_jwt_secret"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install
        working-directory: ./backend
        run: npm ci
      - name: Apply migrations
        working-directory: ./backend
        run: npx prisma migrate deploy
      - name: Test
        working-directory: ./backend
        env:
          NODE_ENV: test
        run: npm test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: ./frontend
        run: npm ci
      - name: Typecheck
        working-directory: ./frontend
        run: npx tsc --noEmit -p .
      - name: Build
        working-directory: ./frontend
        run: npm run build
